<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隔壁老王要偷家</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      max-width: 960px;
      height: 540px;
      background-color: #000000;
      border: 1px solid #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #background-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center; /* 自動置中縮放 */
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      z-index: 1;
    }

    /* 角色立繪與複雜同屏層 */
    #character-layer {
      position: absolute;
      bottom: 0px;
      left: 0;
      width: 100%;
      height: 82%;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 2;
    }

    .single-char {
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      opacity: 0;
      transition: opacity 0.6s ease-in-out, transform 0.4s ease-out;
    }

    .char-zoom {
      transform: scale(1.35) translateY(-5%);
      transform-origin: bottom center;
    }

    /* 旅館撲向大耳狗專屬動畫 */
    .pounce-scene {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .pounce-target {
      position: absolute;
      right: 18%;
      bottom: 2%;
      max-height: 55%;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      animation: targetFloat 1.5s ease-in-out infinite alternate;
    }

    .pounce-attacker {
      position: absolute;
      left: 5%;
      bottom: 0;
      max-height: 95%;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      animation: pounceAction 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes targetFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    @keyframes pounceAction {
      0% {
        transform: translate(-150px, 40px) scale(0.9) rotate(-10deg);
        opacity: 0;
      }
      50% { opacity: 1; }
      100% {
        transform: translate(160px, -20px) scale(1.08) rotate(6deg);
        opacity: 1;
      }
    }

    /* 丸南吃生魚片彈出限動場景 */
    .story-reveal-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }

    .story-char {
      position: absolute;
      left: 8%;
      bottom: 0;
      max-height: 98%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
    }

    .story-card-wrapper {
      position: absolute;
      right: 12%;
      top: 6%;
      height: 82%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.2);
      animation: storyPopIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .story-card-wrapper img {
      height: 100%;
      width: auto;
      display: block;
    }

    @keyframes storyPopIn {
      0% {
        opacity: 0;
        transform: scale(0.6) rotate(-5deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* 哭臉老王 + 旁邊彈出熊男訊息截圖 */
    .bear-msg-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }

    .bear-scene-char {
      position: absolute;
      left: 4%;
      bottom: 0;
      max-height: 105%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      transform: scale(1.15);
      transform-origin: bottom center;
    }

    .bear-card-wrapper {
      position: absolute;
      right: 14%;
      top: 8%;
      height: 80%;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), 0 0 0 3px #222;
      animation: storyPopIn 0.45s ease-out forwards;
    }

    .bear-card-wrapper img {
      height: 100%;
      width: auto;
      display: block;
    }

    /* 戰鬥冰店：修正重疊（熊男靠左，老王強制推至右側） */
    .duo-ice-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .duo-bear-left {
      position: absolute;
      left: 2%;
      bottom: 0;
      max-height: 98%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      animation: fadeInChar 0.6s ease-out forwards;
      z-index: 2;
    }

    .duo-laowang-right {
      position: absolute;
      right: -12%;
      bottom: 0;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      transform: translateX(20%);
      animation: fadeInCharRight 0.6s ease-out forwards;
      z-index: 4;
    }

    @keyframes fadeInCharRight {
      from { opacity: 0; transform: translateX(35%); }
      to { opacity: 1; transform: translateX(20%); }
    }

    /* 熊男深情環抱老王 */
    .hug-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .hug-char {
      max-height: 98%;
      object-fit: contain;
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.8));
      animation: hugPulse 2s ease-in-out infinite alternate;
    }

    /* 生氣小貓彈出卡片 */
    .angry-cat-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .angry-cat-img {
      max-height: 85%;
      max-width: 85%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 0 3px #ef4444;
      animation: catAngerShake 0.4s ease-in-out infinite alternate;
    }

    @keyframes catAngerShake {
      0% { transform: scale(1) rotate(-1deg); }
      100% { transform: scale(1.03) rotate(1.5deg); }
    }

    /* 醉酒電話彈出訊息截圖場景 (支援同時放灰衣老王) */
    .drunk-phone-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .drunk-phone-card {
      position: absolute;
      top: 6%;
      height: 85%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 0 3px rgba(255, 255, 255, 0.3);
      animation: storyPopIn 0.4s ease-out forwards;
      z-index: 5;
    }

    .drunk-phone-card img {
      height: 100%;
      width: auto;
      display: block;
    }

    .drunk-char-left {
      position: absolute;
      left: 4%;
      bottom: 0;
      max-height: 95%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
      animation: fadeInChar 0.5s ease-out forwards;
      z-index: 4;
    }

    /* 酸菜魚同台：支援 2~4 人發言高亮動態放大縮小 */
    .group-scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 0 10px;
    }

    .group-char {
      max-height: 88%;
      max-width: 26%;
      object-fit: contain;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6)) brightness(0.8);
      opacity: 0.85;
      transform-origin: bottom center;
    }

    /* 說話者高亮放大 */
    .group-char.speaker-active {
      max-height: 96%;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8)) brightness(1.05);
      opacity: 1;
      transform: scale(1.15) translateY(-8px);
      z-index: 10;
    }

    @keyframes fadeInChar {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes hugPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 36px;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .menu-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      min-width: 240px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      background: #334155;
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    #achievement-modal {
      width: 80%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 24px;
      max-height: 80%;
      overflow-y: auto;
    }

    .achieve-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .achieve-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .achieve-item {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .achieve-item.unlocked {
      opacity: 1;
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.05);
    }

    .achieve-icon {
      font-size: 1.8rem;
      margin-right: 14px;
    }

    .achieve-info h4 {
      font-size: 1rem;
      margin-bottom: 4px;
      color: #e2e8f0;
    }

    .achieve-item.unlocked h4 {
      color: #fbbf24;
    }

    .achieve-info p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #cutscene-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      z-index: 50;
      overflow: hidden;
      cursor: pointer;
    }

    #plane-sprite {
      position: absolute;
      width: 160px;
      height: auto;
      top: -120px;
      left: -160px;
      opacity: 0.95;
      transform: rotate(35deg);
      pointer-events: none;
      filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.6));
    }

    @keyframes planeLandingMotion {
      0% {
        top: -120px;
        left: -160px;
        transform: rotate(32deg) scale(0.65);
        opacity: 0.3;
      }
      20% { opacity: 1; }
      100% {
        top: 480px;
        left: 1050px;
        transform: rotate(36deg) scale(1.15);
        opacity: 1;
      }
    }

    .anim-plane-landing {
      animation: planeLandingMotion 3.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    #phone-interactive-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      bottom: 135px;
      background: rgba(0, 0, 0, 0.45);
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out;
      padding: 16px 0;
    }

    #phone-interactive-layer.active {
      opacity: 1;
      pointer-events: auto;
    }

    .phone-wrapper {
      position: relative;
      height: 100%;
      max-height: 360px;
      border-radius: 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 0 3px #222;
      overflow: hidden;
      transform: translateY(15px);
      transition: transform 0.4s ease-out;
    }

    #phone-interactive-layer.active .phone-wrapper {
      transform: translateY(0);
    }

    .phone-wrapper img {
      height: 100%;
      width: auto;
      display: block;
    }

    #ig-notif-hitbox {
      position: absolute;
      top: 36.5%;
      left: 4.5%;
      width: 91%;
      height: 12.5%;
      cursor: pointer;
      border-radius: 14px;
      transition: background 0.2s, box-shadow 0.2s;
      animation: notifPulse 1.8s infinite;
    }

    #ig-notif-hitbox:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    @keyframes notifPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(225, 48, 108, 0.4);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(225, 48, 108, 0.7);
      }
    }

    @keyframes phoneShake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-3px, 2px); }
      30% { transform: translate(3px, -2px); }
      45% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      75% { transform: translate(-1px, 1px); }
    }

    .vibrate-box {
      animation: phoneShake 0.15s ease-in-out infinite;
    }

    #dialogue-box {
      position: relative;
      background: rgba(15, 23, 42, 0.95);
      border-top: 2px solid #38bdf8;
      padding: 18px 24px 16px;
      min-height: 130px;
      cursor: pointer;
      z-index: 40;
    }

    #speaker-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
      margin-bottom: 6px;
      min-height: 24px;
    }

    #dialogue-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f1f5f9;
      min-height: 50px;
    }

    #control-bar {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 60;
    }

    .volume-control-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .volume-icon {
      font-size: 0.85rem;
      user-select: none;
    }

    .volume-slider {
      width: 75px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #475569;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .ctrl-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .ctrl-btn:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #choice-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 70;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <audio id="bgm-player" src="assets/bgm.mp3" loop preload="auto"></audio>
    <audio id="bear-bgm-player" src="assets/bear_love_bgm.mp3" loop preload="auto"></audio>

    <div id="background-layer"></div>

    <div id="character-layer"></div>

    <div id="phone-interactive-layer">
      <div class="phone-wrapper">
        <img src="assets/phone.png" alt="手機螢幕">
        <div id="ig-notif-hitbox" title="點擊檢視 Instagram 通知"></div>
      </div>
    </div>

    <div id="start-menu" class="overlay-screen">
      <div class="title">隔壁老王要偷家</div>
      <button id="btn-start" class="menu-btn">開始遊戲</button>
      <button id="btn-achieve" class="menu-btn">成就列表</button>
    </div>

    <div id="achieve-screen" class="overlay-screen hidden">
      <div id="achievement-modal">
        <div class="achieve-header">
          <h2>成就列表</h2>
          <button id="btn-close-achieve" class="ctrl-btn">返回選單</button>
        </div>
        <div id="achieve-items-container" class="achieve-list"></div>
      </div>
    </div>

    <div id="cutscene-layer" class="hidden">
      <img id="plane-sprite" src="assets/plane.png" alt="飛機降落">
    </div>

    <div id="control-bar">
      <div class="volume-control-box" title="背景音樂音量">
        <span class="volume-icon">🔊</span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.7">
      </div>
      <button id="home-btn" class="ctrl-btn">主選單</button>
      <button id="back-btn" class="ctrl-btn">BACK</button>
      <button id="skip-btn" class="ctrl-btn">SKIP</button>
    </div>

    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
    </div>

    <div id="choice-layer" class="hidden"></div>
  </div>

  <script>
    // ===== 音訊控制系統 (要愛愛降低40%音量 = 0.6 基礎倍率) =====
    const bgmPlayer = document.getElementById("bgm-player");
    const bearBgmPlayer = document.getElementById("bear-bgm-player");
    const volumeSlider = document.getElementById("volume-slider");

    let audioCtx = null;
    let masterGainNode = null;
    let bgmGainNode = null;
    let bearGainNode = null;
    let bgmSourceNode = null;
    let bearSourceNode = null;
    let currentActiveBgm = bgmPlayer;

    function initAudioGraph() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        masterGainNode = audioCtx.createGain();
        masterGainNode.connect(audioCtx.destination);

        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
        bgmGainNode.connect(masterGainNode);

        // 熊男要愛愛音樂降低 40% 音量 (設為 0.6)
        bearGainNode = audioCtx.createGain();
        bearGainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
        bearGainNode.connect(masterGainNode);

        bgmSourceNode = audioCtx.createMediaElementSource(bgmPlayer);
        bearSourceNode = audioCtx.createMediaElementSource(bearBgmPlayer);

        bgmSourceNode.connect(bgmGainNode);
        bearSourceNode.connect(bearGainNode);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    volumeSlider.addEventListener("input", (e) => {
      const vol = parseFloat(e.target.value);
      if (masterGainNode && audioCtx) {
        masterGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
      }
    });

    function playBgm(player = bgmPlayer) {
      initAudioGraph();
      if (currentActiveBgm && currentActiveBgm !== player) {
        currentActiveBgm.pause();
        currentActiveBgm.currentTime = 0;
      }
      currentActiveBgm = player;

      const targetVol = parseFloat(volumeSlider.value);
      masterGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGainNode.gain.setValueAtTime(targetVol, audioCtx.currentTime);

      if (player.paused) {
        player.play().catch(err => console.warn("音訊播放受阻", err));
      }
    }

    function fadeOutBgm(duration = 2.5) {
      if (!audioCtx || !masterGainNode || !currentActiveBgm || currentActiveBgm.paused) return;

      const currTime = audioCtx.currentTime;
      const currVol = masterGainNode.gain.value;

      masterGainNode.gain.cancelScheduledValues(currTime);
      masterGainNode.gain.setValueAtTime(currVol, currTime);
      masterGainNode.gain.linearRampToValueAtTime(0.0001, currTime + duration);

      setTimeout(() => {
        if (masterGainNode.gain.value <= 0.05) {
          if (currentActiveBgm) {
            currentActiveBgm.pause();
            currentActiveBgm.currentTime = 0;
          }
          masterGainNode.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);
        }
      }, duration * 1000);
    }

    function stopBgmInstant() {
      if (audioCtx && masterGainNode) {
        masterGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGainNode.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);
      }
      if (bgmPlayer) { bgmPlayer.pause(); bgmPlayer.currentTime = 0; }
      if (bearBgmPlayer) { bearBgmPlayer.pause(); bearBgmPlayer.currentTime = 0; }
    }

    function playPlaneLandingSound() {
      try {
        initAudioGraph();
        const ctx = audioCtx;

        const bufferSize = ctx.sampleRate * 3.5;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(800, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 3.2);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 1.0);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
        noise.stop(ctx.currentTime + 3.5);
      } catch (e) {
        console.warn("飛機音效播放失敗", e);
      }
    }

    function playPhoneVibrateSound() {
      try {
        initAudioGraph();
        const ctx = audioCtx;

        const box = document.getElementById("dialogue-box");
        box.classList.add("vibrate-box");
        setTimeout(() => box.classList.remove("vibrate-box"), 650);

        function triggerVibeBurst(startTime) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(125, startTime);

          const filter = ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(260, startTime);

          gain.gain.setValueAtTime(0.01, startTime);
          gain.gain.linearRampToValueAtTime(0.35, startTime + 0.05);
          gain.gain.linearRampToValueAtTime(0.01, startTime + 0.25);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.25);
        }

        triggerVibeBurst(ctx.currentTime);
        triggerVibeBurst(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn("震動音效播放失敗", e);
      }
    }

    function updateVisualLayers(node) {
      if (node.bg) {
        if (currentBgSrc !== node.bg) {
          currentBgSrc = node.bg;
          bgLayer.style.backgroundImage = `url('${node.bg}')`;
          bgLayer.style.opacity = "1";
        }
      } else {
        currentBgSrc = "";
        bgLayer.style.opacity = "0";
      }

      // 演出模式分流
      if (node.groupScene) {
        // 酸菜魚同台發言高亮模式
        const { chars, active } = node.groupScene;
        let html = '<div class="group-scene">';
        chars.forEach(key => {
          const isActive = key === active ? "speaker-active" : "";
          html += `<img class="group-char ${isActive}" src="${CHAR_ASSET_MAP[key]}" alt="${key}">`;
        });
        html += '</div>';
        charLayer.innerHTML = html;
      } else if (node.suancaiyuDuo) {
        // 酸菜魚：熊男與西屯許光漢二人並列
        charLayer.innerHTML = `
          <div class="duo-ice-scene">

            <img class="duo-laowang-right" src="assets/guanghan.png" alt="西屯許光漢" style="transform: translateX(10%); max-height: 98%;">

        `;
      } else if (node.drunkPhoneWithHoodie) {

        charLayer.innerHTML = `

            <img class="pounce-attacker" src="assets/laowang.png" alt="隔壁老王">

      } else if (node.character) {
        const zoomClass = node.charZoom ? "char-zoom" : "";

        const img = charLayer.querySelector(".single-char");
        if (img) img.style.opacity = "1";
      } else {
        charLayer.innerHTML = "";
      }

      if (node.showPhone) {
        phoneInteractiveLayer.classList.add("active");

    function playIntroCutscene(onComplete) {
      cutsceneLayer.classList.remove("hidden");
      planeSprite.classList.remove("anim-plane-landing");
      void planeSprite.offsetWidth;

      playPlaneLandingSound();
      planeSprite.classList.add("anim-plane-landing");

      const finishCutscene = () => {
        clearTimeout(cutsceneTimer);
        cutsceneLayer.removeEventListener("click", finishCutscene);
        cutsceneLayer.classList.add("hidden");
        planeSprite.classList.remove("anim-plane-landing");
        if (onComplete) onComplete();
      };

      cutsceneLayer.addEventListener("click", finishCutscene);
      cutsceneTimer = setTimeout(finishCutscene, 3500);
    }

    function startGame() {
      initAudioGraph();
      startMenu.classList.add("hidden");
      achieveScreen.classList.add("hidden");
      phoneInteractiveLayer.classList.remove("active");

      currentBgSrc = "";
      charLayer.innerHTML = "";
      bgLayer.style.opacity = "0";
      historyStack = [];
      updateBackButtonState();

      playIntroCutscene(() => {
        renderNode("intro_1", false);
      });
    }

    function returnToMenu() {
      clearInterval(typeTimer);
      clearTimeout(cutsceneTimer);
      isTyping = false;
      stopRightKeySkip();
      stopBgmInstant();
      cutsceneLayer.classList.add("hidden");
      phoneInteractiveLayer.classList.remove("active");
      choiceLayer.classList.add("hidden");
      bgLayer.style.opacity = "0";
      charLayer.innerHTML = "";
      currentBgSrc = "";
      historyStack = [];
      startMenu.classList.remove("hidden");
    }

    function updateBackButtonState() {
      backBtn.disabled = historyStack.length === 0;
    }

    function renderNode(nodeKey, pushHistory = true) {
      const node = storyScript[nodeKey];
      if (!node) return;

      if (pushHistory && currentNodeKey) {
        historyStack.push(currentNodeKey);
      }
      updateBackButtonState();

      currentNodeKey = nodeKey;
      speakerEl.textContent = node.speaker || "";
      choiceLayer.classList.add("hidden");
      choiceLayer.innerHTML = "";

      updateVisualLayers(node);

      if (typeof node.onEnter === "function") {
        node.onEnter();
      }

      if (node.unlockAchievement) {
        unlockAchievement(node.unlockAchievement);
      }

      typewriter(node.text, () => {
        if (node.choices && node.choices.length > 0) {
          showChoices(node.choices);
        }
      });
    }

    function goBack() {
      if (historyStack.length === 0) return;
      clearInterval(typeTimer);
      isTyping = false;
      const prevNodeKey = historyStack.pop();
      renderNode(prevNodeKey, false);
    }

    function typewriter(fullText, onComplete) {
      clearInterval(typeTimer);
      isTyping = true;
      currentFullText = fullText;
      textEl.textContent = "";

      let charIndex = 0;
      typeTimer = setInterval(() => {
        textEl.textContent += fullText[charIndex];
        charIndex++;

        if (charIndex >= fullText.length) {
          clearInterval(typeTimer);
          isTyping = false;
          if (onComplete) onComplete();
        }
      }, 35);
    }

    function completeTextInstantly() {
      clearInterval(typeTimer);
      textEl.textContent = currentFullText;
      isTyping = false;

      const node = storyScript[currentNodeKey];
      if (node.choices && node.choices.length > 0) {
        showChoices(node.choices);
      }
    }

    function showChoices(choices) {
      choiceLayer.innerHTML = "";
      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "menu-btn";
        btn.textContent = choice.text;
        btn.onclick = () => renderNode(choice.nextNode);
        choiceLayer.appendChild(btn);
      });
      choiceLayer.classList.remove("hidden");
    }

    igNotifHitbox.addEventListener("click", (e) => {
      e.stopPropagation();
      const node = storyScript[currentNodeKey];
      if (node && node.requirePhoneClick) {
        phoneInteractiveLayer.classList.remove("active");
        renderNode(node.nextNode);
      }
    });

    document.getElementById("btn-start").addEventListener("click", startGame);

    document.getElementById("btn-achieve").addEventListener("click", () => {
      renderAchievementList();
      achieveScreen.classList.remove("hidden");
    });

    document.getElementById("btn-close-achieve").addEventListener("click", () => {
      achieveScreen.classList.add("hidden");
    });

    homeBtn.addEventListener("click", returnToMenu);

    backBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      goBack();
    });

    // ===== 鍵盤右鍵前進與長按高頻快進系統 =====
    function advanceDialogue() {
      if (!startMenu.classList.contains("hidden") || !achieveScreen.classList.contains("hidden")) {
        return;
      }

      if (!cutsceneLayer.classList.contains("hidden")) {
        clearTimeout(cutsceneTimer);
        cutsceneLayer.classList.add("hidden");
        planeSprite.classList.remove("anim-plane-landing");
        renderNode("intro_1", false);
        return;
      }

      const node = storyScript[currentNodeKey];
      if (!node) return;

      if ((node.choices && node.choices.length > 0) || node.requirePhoneClick) {
        stopRightKeySkip();
        return;
      }

      if (isTyping) {
        completeTextInstantly();
        return;
      }

      if (node.onNext) {
        node.onNext();
      } else if (node.nextNode) {
        renderNode(node.nextNode);
      }
    }

    let rightKeyHoldTimeout = null;
    let rightKeyFastSkipInterval = null;
    let isRightKeyPressed = false;

    function stopRightKeySkip() {
      clearTimeout(rightKeyHoldTimeout);
      clearInterval(rightKeyFastSkipInterval);
      rightKeyHoldTimeout = null;
      rightKeyFastSkipInterval = null;
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.code === "ArrowRight") {
        e.preventDefault();

        if (isRightKeyPressed) return;
        isRightKeyPressed = true;

        advanceDialogue();

        rightKeyHoldTimeout = setTimeout(() => {
          rightKeyFastSkipInterval = setInterval(() => {
            advanceDialogue();
          }, 70);
        }, 300);
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight" || e.code === "ArrowRight") {
        isRightKeyPressed = false;
        stopRightKeySkip();
      }
    });

    window.addEventListener("blur", () => {
      isRightKeyPressed = false;
      stopRightKeySkip();
    });

    dialogueBox.addEventListener("click", advanceDialogue);

    skipBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      advanceDialogue();
    });
  </script>
</body>
</html>
